[project]
name = "voicepilot-evals"
version = "0.1.0"
description = "VoicePilot V1 评测基础设施(Inspect AI + promptfoo)"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3,<0.4",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.0,<5.0",
    # 注意：promptfoo 是 Node CLI（npm i -g promptfoo / npx promptfoo），PyPI 上
    # 只有同名的 0.1–0.2 占位包，>=0.90 永远解析不到，会让 pip install -e . 直接失败。
    # 红队/数据安全脚本用 `promptfoo eval -c ...` 调用它，不属于 Python 依赖。
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

# setuptools 扁平布局下会把每个顶层目录当成候选包（functional/redteam/toctou/…
# 都是数据目录，不是包），导致 `pip install -e .` 直接报
# "Multiple top-level packages discovered in a flat-layout"。只有 scorers 是
# 真正的 Python 包（有 __init__.py），显式声明即可，顺带关掉命名空间猜测。
[tool.setuptools]
packages = ["scorers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

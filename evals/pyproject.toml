[project]
name = "voicepilot-evals"
version = "0.1.0"
description = "VoicePilot V1 评测基础设施(Inspect AI + promptfoo)"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3,<0.4",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.0,<5.0",
    "promptfoo>=0.90,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

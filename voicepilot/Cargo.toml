[workspace]
resolver = "2"
members = [
    "crates/trust-kernel",
    "crates/cli",
    "crates/ui",
]
default-members = [
    "crates/trust-kernel",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["VoicePilot Team"]
license = "MIT"

# W12 Plan 3: rustdoc 配置(spec §六 Plan 3)。
# all-features = true 生成全特性 API docs,no-default-features = true 避免默认特性
# 引入 voice/tauri 的额外编译噪声。docs.rs 与本地 cargo doc 均使用此配置。
[workspace.metadata.docs.rs]
all-features = true
no-default-features = true

[workspace.dependencies]
# W7: default-features=false 让 downstream crate 显式 opt-in trust-kernel 的 feature
# (llm/voice/tauri)。与 trust-kernel/default = ["llm"] 配合:downstream 默认需写
# `default = ["llm"]` 才能保留 LLM 路由能力。
trust-kernel = { path = "crates/trust-kernel", version = "0.1.0", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
cedar-policy = "4.11.2"
walkdir = "2.5"
similar = "2"
ureq = { version = "2", features = ["tls"] }
dirs = "5"
sherpa-rs = { version = "0.6.8", features = ["download-binaries", "tts"] }
cpal = { version = "0.15" }
# 抗混叠重采样(麦克风 48k → ASR 16k),替代 W5 PoC 线性插值
rubato = "0.15"
hound = { version = "3.5" }
bzip2 = "0.4"
tar = "0.4"
tauri = { version = "2", features = ["wry"] }
tauri-build = { version = "2" }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
regex = "1"
# W7: LLM + 用户自定义 Skill 解析(UIA 依赖在 Plan 4 添加)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_yaml = "0.9"
# W9 Plan 1: Stronghold 加密基础(spec §2.1 feature flag + §6.1 密钥管理)
# - tauri-plugin-stronghold: 封装 IOTA Stronghold(XChaCha20Poly1305 + Argon2id + SaltClientHash)
# - iota_stronghold: procedures API(AeadEncrypt/AeadDecrypt/WriteVault),tauri-plugin-stronghold 未 re-export
# - argon2: 密钥派生(user_password -> derived_key,参数 m=64MB t=3 p=4)
# - rand: 生成 16 字节 salt + 24 字节 nonce + 32 字节 encryption key
tauri-plugin-stronghold = "2"
iota_stronghold = "2"
argon2 = "0.5"
rand = "0.8"
# Wave 3 Task 3.1: Windows Credential Manager via `keyring` (SecretStore).
# `windows-native` backend is enabled; the dependency itself is declared only
# under `[target.'cfg(windows)'.dependencies]` in trust-kernel so the default
# build has no keyring on non-Windows targets.
keyring = { version = "3", features = ["windows-native"] }

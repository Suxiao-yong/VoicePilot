[workspace]
resolver = "2"
members = [
    "crates/trust-kernel",
    "crates/cli",
    "crates/ui",
]
default-members = [
    "crates/trust-kernel",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
authors = ["VoicePilot Team"]
license = "MIT"

[workspace.dependencies]
# W7: default-features=false 让 downstream crate 显式 opt-in trust-kernel 的 feature
# (llm/voice/tauri)。与 trust-kernel/default = ["llm"] 配合:downstream 默认需写
# `default = ["llm"]` 才能保留 LLM 路由能力。
trust-kernel = { path = "crates/trust-kernel", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
cedar-policy = "4.11.2"
walkdir = "2.5"
similar = "2"
ureq = { version = "2", features = ["tls"] }
dirs = "5"
sherpa-rs = { version = "0.6.8", features = ["download-binaries", "tts"] }
cpal = { version = "0.15" }
hound = { version = "3.5" }
bzip2 = "0.4"
tar = "0.4"
tauri = { version = "2", features = ["wry"] }
tauri-build = { version = "2" }
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
regex = "1"
# W7: LLM + 用户自定义 Skill 解析(UIA 依赖在 Plan 4 添加)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_yaml = "0.9"

[package]
name = "trust-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
cedar-policy = { workspace = true }
walkdir = { workspace = true }
similar = { workspace = true }
ureq = { workspace = true, optional = true }
# W7 Plan 3: `dirs` 用于定位 %APPDATA%\voicepilot\skills 目录。
# 非 optional:tauri feature 不依赖 voice,所以 user-skill 加载不能
# gated 在 voice feature 后面(项目 memory: feature 独立性)。
dirs = { workspace = true }
sherpa-rs = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
# W7: LLM 客户端(OpenAI 兼容)+ 用户自定义 Skill YAML 解析(UIA 在 Plan 4 添加)
reqwest = { workspace = true, optional = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
# W7 Plan 3: user_loader.rs 用 regex 校验 skill id。
regex = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
wiremock = "0.6"

[features]
default = ["llm"]
voice = ["dep:sherpa-rs", "dep:cpal", "dep:hound", "dep:ureq", "dep:bzip2", "dep:tar"]
llm = ["dep:reqwest"]

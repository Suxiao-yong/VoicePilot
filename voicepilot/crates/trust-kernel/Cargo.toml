[package]
name = "trust-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
cedar-policy = { workspace = true }
walkdir = { workspace = true }
similar = { workspace = true }
ureq = { workspace = true, optional = true }
# W7 Plan 3: `dirs` 用于定位 %APPDATA%\voicepilot\skills 目录。
# 非 optional:tauri feature 不依赖 voice,所以 user-skill 加载不能
# gated 在 voice feature 后面(项目 memory: feature 独立性)。
dirs = { workspace = true }
sherpa-rs = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
hound = { workspace = true, optional = true }
bzip2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
# W7: LLM 客户端(OpenAI 兼容)+ 用户自定义 Skill YAML 解析(UIA 在 Plan 4 添加)
reqwest = { workspace = true, optional = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
# W7 Plan 3: user_loader.rs 用 regex 校验 skill id。
regex = { workspace = true }
# W9 Plan 1: Stronghold 加密辅助库(非 optional,因为 EncryptedPayload 的 Serialize/Deserialize
# 在 feature 关闭时也需要类型存在 —— 但 StrongholdVault 本身用 #[cfg(feature)] 门控)
bincode = "1"
base64 = "0.22"
# W9 审查修复 P1-1:zeroize 改为 optional,通过 stronghold feature 启用,
# 确保 derived_key 的 Zeroizing 包装在 feature 关闭时不会被错误引用。
zeroize = { version = "1", optional = true, features = ["derive"] }
# W9 Plan 1: Stronghold 加密(optional,通过 stronghold feature 启用)
tauri-plugin-stronghold = { workspace = true, optional = true }
iota_stronghold = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
uuid = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
wiremock = "0.6"

[features]
default = ["llm"]
voice = ["dep:sherpa-rs", "dep:cpal", "dep:hound", "dep:ureq", "dep:bzip2", "dep:tar"]
llm = ["dep:reqwest"]
uia = ["dep:uiautomation"]
# W9 Plan 1: Stronghold 加密基础(spec §2.1 feature flag)。
# 与 voice / tauri / llm feature 正交,可独立编译(spec §10 第 7 条)。
# 启用方式:cargo check --features stronghold / cargo test --features stronghold
# W9 审查修复 P1-1:加 dep:zeroize,使 derived_key 的 Zeroizing 包装可用。
# W9 实现修复:加 dep:iota_stronghold,procedures API(AeadEncrypt/AeadDecrypt/WriteVault)需要直接依赖。
# W9 实现修复:加 dep:rand,生成 salt / nonce / encryption key。
stronghold = ["dep:tauri-plugin-stronghold", "dep:iota_stronghold", "dep:argon2", "dep:rand", "dep:zeroize"]

[target.'cfg(windows)'.dependencies]
# W7 Plan 4: Windows UIA 自动化(opt-in via `uia` feature, Windows-only)。
# crates.io 上 crate 名为 `uiautomation`(repo 名才是 uiautomation-rs)。
uiautomation = { version = "0.16", optional = true }

[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "voicepilot"
path = "src/main.rs"

[dependencies]
trust-kernel = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
# W8 Plan 4: voice-dag 子命令需要 tokio runtime 来调 async route_text_with_dag
tokio = { workspace = true }
# W10 Plan 3: voice latency-stats / latency-prune 命令需要 chrono 计算 now_ms + since 偏移
chrono = { workspace = true }

[features]
default = ["llm"]
# W7: LLM 路由能力(默认开启,与 trust-kernel/default 对齐)
llm = ["trust-kernel/llm"]
voice = ["trust-kernel/voice", "llm"]

[package]
name = "voicepilot-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "voicepilot_ui"
path = "src/lib.rs"

[[bin]]
name = "voicepilot-ui"
path = "src/main.rs"
required-features = ["tauri"]

[build-dependencies]
tauri-build = { workspace = true, optional = true }

[dependencies]
trust-kernel = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, optional = true, features = ["time"] }
tauri = { workspace = true, optional = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-dialog = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
regex = { workspace = true }

[features]
default = ["llm"]
# W7: LLM 客户端路由能力(默认开启,与 trust-kernel/default 对齐)。
# voicepilot-ui 代码用 #[cfg(feature = "llm")] 门控 SkillWithSlots 匹配臂等,
# 与 trust-kernel/llm 同步开闭。
llm = ["trust-kernel/llm"]
# W7 Plan 4: UIA 应用控制能力(Windows-only,与 trust-kernel/uia 同步开闭)。
# voicepilot-ui 通过 trust-kernel 的 quick.app_control / note.capture Skill
# 调用 UIA 适配器;启用此 feature 才能在 Windows 上真正驱动应用。
uia = ["trust-kernel/uia"]
# Tauri UI shell only — no voice subsystem dependency.
# This decouples W6a UI work from the W5 voice environment (whisper-rs bindgen
# issue #49), allowing the desktop shell to compile and run on systems where
# voice is unavailable. Voice commands in the UI are gated with #[cfg(feature = "voice")].
tauri = ["dep:tauri", "dep:tauri-build", "dep:tokio", "dep:tracing-subscriber", "dep:tauri-plugin-dialog"]
# Opt-in voice subsystem (requires whisper-rs build environment).
# Enables voice-listen and related Tauri commands that bridge to trust-kernel/voice.
voice = ["tauri", "trust-kernel/voice", "llm"]

[dev-dependencies]
tempfile = "3"

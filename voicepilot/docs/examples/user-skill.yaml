# 示例只读扩展

本 Skill 绑定到 `docs/examples/mcp-plugin.json` 定义的只读 MCP server，调用 `read_item`
只读工具。它**不会写入任何文件或发起副作用**；显式的 `allowed_paths` 白名单与
`egress: local_only` 在规划层约束其行为。

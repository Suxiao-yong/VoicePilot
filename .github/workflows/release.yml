# VoicePilot V1 Release (W12 Plan 5)
# spec §八 Plan 5:tag v* 触发 NSIS 打包上传 GitHub Release
#
# 触发:
#   push tag v* -> 构建 NSIS 安装包 -> 上传 GitHub Release
#
# 产物:
#   voicepilot/crates/ui/target/release/bundle/nsis/*.exe
#
# 说明:
# - V1 不做代码签名(ADR 0001 / spec §8.4 偏离),release notes 标注未签名
# - WebView2 bootstrapper 会在安装时自动引导 WebView2 运行时

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-nsis:
    name: Build NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: voicepilot/crates/ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-nsis

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build NSIS installer
        run: cargo tauri build --target nsis

      - name: Verify installer artifact
        run: |
          Get-ChildItem "target/release/bundle/nsis/*.exe" | ForEach-Object { Write-Host "Artifact: $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: voicepilot/crates/ui/target/release/bundle/nsis/*.exe
          draft: true
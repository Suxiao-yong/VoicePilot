# VoicePilot V1 周审计 (W12 Plan 6)
# spec §九 Plan 6:cargo audit + npm audit 每周一 00:00 UTC
#
# 触发:
#   schedule: 每周一 00:00 UTC
#   workflow_dispatch: 手动重跑

name: audit

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  # 注意:rustsec/audit-check 是 node action,defaults.run.working-directory 只对
  # run: 步骤生效,对 uses: 步骤一律无效(GitHub Actions 官方文档明确只作用于 run 步骤)。
  # 该 action 内部执行 `cargo audit --json --file ${{ inputs.working-directory }}/Cargo.lock`,
  # 默认值 ".";不显式传 voicepilot 就会在仓库根目录找 Cargo.lock,根目录没有 ->
  # stdout 为空 -> JSON.parse("") 抛错 -> core.setFailed -> job 红。
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: voicepilot

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voicepilot/crates/ui/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --audit-level=high